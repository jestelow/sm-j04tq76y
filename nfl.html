async function open_(pw){const S=crypto.subtle,salt=u(D.salt),nonce=u(D.nonce),ct=u(D.ct),tag=u(D.tag);
 const base=await S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 const k=new Uint8Array(await S.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:D.iter},base,512));
 const mk=await S.importKey("raw",k.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
 const msg=new Uint8Array(nonce.length+ct.length);msg.set(nonce);msg.set(ct,nonce.length);
 if(!await S.verify("HMAC",mk,tag,msg))return false;

 for(let i=0;i<n;i++){const b=new Uint8Array(56);b.set(ek);b.set(nonce,32);let x=i;for(let j=7;j>=0;j--){b[48+j]=x%256;x=Math.floor(x/256)}jobs.push(S.digest("SHA-256",b))}
